name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Tests, server, Android, desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :shared:jvmTest :server:test
      - name: Build
        run: ./gradlew :server:installDist :androidApp:bundleRelease :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: middleman-release-aab-unsigned
          path: androidApp/build/outputs/bundle/release/*.aab

  # Its own job, and strictly sequential. In a combined parallel build, webpack intermittently
  # failed with "Can't resolve '@js-joda/core'" on identical code: the npm install that provides it
  # was racing other tasks. Nothing else runs beside it here.
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-parallel :composeApp:wasmJsBrowserDistribution
      - name: Check the bundle exists
        run: test -s composeApp/build/dist/wasmJs/productionExecutable/middleman.js
      - uses: actions/upload-artifact@v4
        with:
          name: middleman-web
          path: composeApp/build/dist/wasmJs/productionExecutable

  ios:
    name: iOS framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64
